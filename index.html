<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KISAANU NEXUS - Responsive Web & Mobile App</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #0E1810;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* Responsive Wrapper for Mobile, Tablet, and Desktop */
      #app-wrapper {
        width: 100%;
        height: 100%;
        max-width: 480px;
        max-height: 920px;
        background-color: #FFFFFF;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
      }

      /* Desktop / Laptop / Large Screen */
      @media (min-width: 768px) {
        #app-wrapper {
          height: 90vh;
          border-radius: 28px;
          box-shadow: 0 25px 65px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.12);
        }
      }

      /* Tablet Screen */
      @media (min-width: 500px) and (max-width: 767px) {
        #app-wrapper {
          height: 94vh;
          max-width: 520px;
          border-radius: 22px;
          box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
        }
      }

      /* Mobile Device Screen (Full viewport) */
      @media (max-width: 499px) {
        #app-wrapper {
          max-width: 100%;
          max-height: 100%;
          height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }
      }

      #root, #root > div {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app-wrapper">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/index.web.js"></script>
  </body>
</html>
